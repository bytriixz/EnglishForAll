<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página de Cadastro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&display=swap">
<style>
    :root {
        --fundo: #c3dde3;
        --barra: #55b4d8;
        --botao: #4a7fc1;
        --texto: #1d2b4a;
    }

    * {
        box-sizing: border-box;
    }

    [hidden] {
        display: none !important;
    }

    body {
        margin: 0;
        background: #9fc2cc;
        font-family: 'Libre Baskerville', Georgia, serif;
        color: var(--texto);
        display: flex;
        justify-content: center;
    }

    /* O mapa-múndi vem do arquivo images/mapa.png (recorte do protótipo). Sem ele, o fundo fica liso. */

    .tela {
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        background: var(--fundo) url(images/mapa.png) no-repeat top center/100% auto;
        padding: 40px 28px;
    }

    h1 {
        margin: 0 0 56px;
        font-style: italic;
        font-weight: 400;
        letter-spacing: .2em;
        text-transform: uppercase;
        text-align: center;
        font-size: 24px;
        line-height: 1.5;
    }

    label {
        display: block;
        margin: 20px 0 6px;
        font-size: 17px;
    }

    input {
        width: 100%;
        height: 32px;
        border: 0;
        border-radius: 4px;
        background: var(--barra);
        padding: 0 10px;
        font: inherit;
        color: var(--texto);
    }

    input:focus-visible,
    .btn:focus-visible,
    a:focus-visible {
        outline: 3px solid var(--texto);
    }

    .btn {
        display: block;
        margin: 36px auto 0;
        padding: 10px 26px;
        border: 0;
        border-radius: 4px;
        background: var(--botao);
        color: #fff;
        font: inherit;
        font-size: 17px;
        cursor: pointer;
    }

    .btn:hover {
        background: #3b69a3;
    }

    .msg {
        min-height: 20px;
        margin-top: 14px;
        text-align: center;
        font-size: 14px;
    }

    .links {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
    }

    a {
        color: var(--botao);
    }
</style>
</head>
<body>
<main class="tela">
  <h1>Welcome<br>to<br>English<br>for all</h1>

  <form id="cadastroForm" novalidate>

    <!-- Passo 1 (protótipo, imagem 2) -->
    <div id="passo1">
      <label for="fullname">Nome</label>
      <input type="text" id="fullname" name="fullname" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="anoEscolar">Ano escolar</label>
      <input type="text" id="anoEscolar" name="anoEscolar" required>
      <button type="button" class="btn" id="continuar">Continue</button>
      <p class="links"><a href="login.html#entrar">Já tem uma conta? Entrar</a></p>
    </div>

    <!-- Passo 2 (protótipo, imagem 3) -->
    <div id="passo2" hidden>
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Senha:</label>
      <input type="password" id="password" name="password" required>
      <label for="confirm_password">Confirme sua senha:</label>
      <input type="password" id="confirm_password" name="confirm_password" required>
      <button type="submit" class="btn">Confirmar</button>
      <p class="links"><a href="#" id="voltar">Voltar</a></p>
    </div>

    <p class="msg" id="msg" role="status"></p>
  </form>
</main>

<script>
  const form = document.getElementById('cadastroForm')
  const msg = document.getElementById('msg')
  const passo1 = document.getElementById('passo1')
  const passo2 = document.getElementById('passo2')

  //verifica se os campos de um passo estão preenchidos corretamente
  function passoValido(passo){
    return Array.from(passo.querySelectorAll('input')).every(campo => campo.reportValidity())
  }

  document.getElementById('continuar').addEventListener('click', () => {
    if (!passoValido(passo1)) return;
    msg.textContent = ""
    passo1.hidden = true
    passo2.hidden = false
  })

  document.getElementById('voltar').addEventListener('click', (e) => {
    e.preventDefault()
    msg.textContent = ""
    passo2.hidden = true
    passo1.hidden = false
  })

  //função chamada após envio do formulário
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!passoValido(passo2)) return;

    const fullname = form.fullname.value;
    const email = form.email.value;
    const anoEscolar = form.anoEscolar.value;
    const username = form.username.value;
    const password = form.password.value;
    const confirmPassword = form.confirm_password.value;

    if (password !== confirmPassword) {
      msg.textContent = "As senhas não coincidem.";
      msg.style.color = "#9b1c1c";
      return;
    }

    try {
      //envia os dados para a função /cadastrarUser no servidor
      const response = await fetch('/cadastrarUser', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ fullname, email, username, password, anoEscolar })
      });

      const data = await response.json();

      if (response.ok) {
        msg.textContent = "Conta criada com sucesso! Redirecionando para a página de login...";
        msg.style.color = "#1c6b2f";
        setTimeout(() => window.location.href = "login.html#entrar", 1500);
      } else {
        msg.textContent = data.error || "Erro ao criar conta.";
        msg.style.color = "#9b1c1c";
      }

    } catch (err) {
      msg.textContent = "Erro de conexão com o servidor.";
      msg.style.color = "#9b1c1c";
    }
  });
</script>
</body>
</html>
