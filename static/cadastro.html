<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
</head>

<style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1b1b1b;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 1.0);
      border-radius: 8px;
      margin: 20px;
      overflow: hidden;
    }

    .logo-section {
      flex: 1;
      min-width: 350px;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .logo-section img {
      max-width: 80%;
      max-height: 80%;
    }

    .form-section {
      flex: 1;
      min-width: 350px;
      background-color: #ffde59;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #004aad;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      height: 15px;
      color: black;
    }

    .input-group input {
      width: 100%;
      padding: 4px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .submit-button {
      width: 100%;
      padding: 12px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .submit-button:hover {
      background-color: #5f6546;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      font-weight: bold;
      color: #004aad;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #fff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }

      .logo-section,
      .form-section {
        flex: none;
        width: 100%;
      }

      .logo-section {
        padding: 30px 20px;
        min-height: 200px;
      }

      .form-section {
        padding: 30px;
      }
    }
</style>

<body>
    <div class="container">
    <div class="form-section">
      <h2>Criar Conta</h2>
      <form id="cadastroForm">
        <div class="input-group">
          <label for="fullname">Nome Completo:</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
          <label for="username">Usuário:</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
          <label for="password">Senha:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="input-group">
          <label for="confirm_password">Confirmar Senha:</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="submit-button">Criar Conta</button>
        <div class="links">
          <a href="login.html">Já tem uma conta? Entrar</a>
        </div>
        <p class="message" id="msg"></p>
      </form>
    </div>
    <div class="logo-section">
      <img src="images/logo.png" alt="Logo EnglishForAll">
    </div>
  </div>

  <script>
    //obtendo informações do formulário de cadastro
    const form = document.getElementById('cadastroForm')
    const msg = document.getElementById('msg')

    //função chamada após envio do formulário
    form.addEventListener('submit', async (e) =>{
        e.preventDefault();

        //obter valores do formulário
        const fullname = form.fullname.value;
        const email = form.email.value;
        const username = form.username.value;
        const password = form.password.value;
        const confirmPassword = form.confirm_password.value;

        //confirmação de senha
        if (password !== confirmPassword) {
            msg.textContent = "As senhas não coindicem.";
            msg.style.color = "yellow";
            return;
        }

        try {
            //envia os dados para a função /cadastrarUser no servidor
            const response = await fetch('/cadastrarUser',{
                //definições de envio dos dados
                method: 'POST',
                headers: {'Content-Type':'application/json' },
                body: JSON.stringify({fullname, email, username, password })
            });

            const data = await response.json();

            //mensagem de sucesso e redirecionamento para login
            if (response.ok){
                msg.textContent = "Conta criada com sucesso! redirecionando para página de login...";
                msg.style.color = "green";

                setTimeout(() => window.location.href = "login.html", 1500);

        //mensagens de erro
            }else{
                msg.textContent = (data.error || "Erro ao criar conta.");
                msg.style.color = "red";
            }

        }catch (err) {
            msg.textContent = "Erro de coneão com o servidor.";
            msg.style.color = "red";
        }

    });
  </script>

</body>
</html>
